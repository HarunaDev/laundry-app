services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/LaundryApp/.env
    depends_on:
      redis:
        condition: service_healthy

  mobile:
    build: ./mobile
    ports:
      - "8081:8081"
      - "3000:3000"

  admin:
    build: ./admin
    ports:
      - "4000:80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
